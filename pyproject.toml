[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrptw-branch-and-price"
version = "0.3.0"
description = "Exact Branch-and-Price solver for the Vehicle Routing Problem with Time Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
gurobi = ["gurobipy>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
vrptw-cg = "vrptw_cg.cli:run"
vrptw-cg-benchmark = "vrptw_cg.benchmark:main"

[tool.setuptools.packages.find]
include = ["vrptw_cg*"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` invocation (as opposed to `python -m pytest`,
# which always prepends the current directory to sys.path) cannot find the
# vrptw_cg package unless it has been pip-installed first -- this bit CI.
pythonpath = ["."]
